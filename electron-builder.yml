appId: cm.minepia.drepia.rapports
productName: DREPIA Rapports
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
extraResources:
  - minepia-logo.png
asarUnpack:
  - '**/*.node'
win:
  target: nsis
linux:
  target: AppImage
mac:
  target: dmg
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
